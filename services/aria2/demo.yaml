services:
  Aria2-Pro:
    container_name: aria2-pro
    image: p3terx/aria2-pro
    environment:
      - PUID=65534
      - PGID=65534
      - UMASK_SET=022
      - RPC_SECRET=aria22
      - RPC_PORT=6800
      - LISTEN_PORT=6888
      - DISK_CACHE=64M
      - IPV6_MODE=false
      - UPDATE_TRACKERS=true
      - CUSTOM_TRACKER_URL=
      - TZ=Asia/Dhaka
    volumes:
      - ${PWD}/config:/config
      - ${PWD}/downloads:/downloads
    # If you use host network mode, then no port mapping is required.
    # This is the easiest way to use IPv6 networks.
    # network_mode: host
    network_mode: bridge
    ports:
      - 6800:6800
      - 6888:6888
      - 6888:6888/udp
    restart: unless-stopped
    # Since Aria2 will continue to generate logs, limit the log size to 1M to prevent your hard disk from running out of space.
    logging:
      driver: json-file
      options:
        max-size: 1m

  # AriaNg is just a static web page, usually you only need to deploy on a single host.
  AriaNg:
    container_name: ariang
    image: p3terx/ariang
    command: --port 6880 --ipv6
    # network_mode: host
    network_mode: bridge
    ports:
      - 6880:6880
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 1m

  nginx:
    image: nginx:alpine
    container_name: aria2-nginx
    ports:
      - "6881:80"
    volumes:
      # Your aria2 download folder
      - ${PWD}/downloads:/usr/share/nginx/html:ro
      # Custom nginx config
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/.htpasswd:ro
    restart: unless-stopped

  samba:
    image: dockurr/samba
    container_name: samba
    environment:
      NAME: "downloads"
      USER: "adminn"
      PASS: "adminn"
    ports:
      - 445:445
    volumes:
      - ${PWD}/downloads:/storage
    restart: always
